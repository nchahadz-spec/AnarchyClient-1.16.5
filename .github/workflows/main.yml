name: Build AnarchyClient

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Sử dụng Action chính thức của Gradle để tự động thiết lập môi trường
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.2 # Bạn có thể đổi thành version bạn muốn

    # Chạy build trực tiếp bằng lệnh 'gradle' thay vì './gradlew'
    - name: Build with Gradle
      run: gradle build --no-daemon

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: AnarchyClient-Build
        path: build/libs/*.jar
